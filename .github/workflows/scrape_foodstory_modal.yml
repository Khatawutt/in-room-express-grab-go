name: Scrape FoodStory Menu from Modal

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/foodstory-scrape
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tools/foodstory-scrape/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run scraper unit tests
        run: python -m unittest discover -s tests -v

      - name: Run FoodStory menu scraper
        env:
          FOODSTORY_USERNAME: ${{ secrets.FOODSTORY_USERNAME }}
          FOODSTORY_PASSWORD: ${{ secrets.FOODSTORY_PASSWORD }}
        run: python scripts/scrape_foodstory_modal.py

      - name: Upload menu exports
        uses: actions/upload-artifact@v4
        with:
          name: foodstory-menu-export
          path: |
            tools/foodstory-scrape/data/foodstory_menu_export_*.xlsx
            tools/foodstory-scrape/data/foodstory_menu_export_*.csv
            tools/foodstory-scrape/data/foodstory_menu_export_*.json
