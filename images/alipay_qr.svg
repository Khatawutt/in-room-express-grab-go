<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#ffffff"/>
  <!-- Alipay blue brand color -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1649d0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0b2fa3;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Quiet zone -->
  <rect x="20" y="20" width="360" height="360" fill="#ffffff"/>
  <!-- Finder patterns (position detection) -->
  <rect x="40" y="40" width="70" height="70" fill="url(#grad)"/>
  <rect x="52" y="52" width="46" height="46" fill="#ffffff"/>
  <rect x="60" y="60" width="30" height="30" fill="url(#grad)"/>

  <rect x="290" y="40" width="70" height="70" fill="url(#grad)"/>
  <rect x="302" y="52" width="46" height="46" fill="#ffffff"/>
  <rect x="310" y="60" width="30" height="30" fill="url(#grad)"/>

  <rect x="40" y="290" width="70" height="70" fill="url(#grad)"/>
  <rect x="52" y="302" width="46" height="46" fill="#ffffff"/>
  <rect x="60" y="320" width="30" height="30" fill="url(#grad)"/>

  <!-- Timing patterns -->
  <rect x="120" y="72" width="2" height="220" fill="url(#grad)"/>
  <rect x="72" y="120" width="220" height="2" fill="url(#grad)"/>

  <!-- Data modules (placeholder pattern) -->
  <g fill="url(#grad)">
    <rect x="120" y="120" width="10" height="10"/>
    <rect x="140" y="120" width="10" height="10"/>
    <rect x="160" y="120" width="10" height="10"/>
    <rect x="180" y="120" width="10" height="10"/>
    <rect x="200" y="120" width="10" height="10"/>
    <rect x="120" y="140" width="10" height="10"/>
    <rect x="140" y="140" width="10" height="10"/>
    <rect x="160" y="140" width="10" height="10"/>
    <rect x="180" y="140" width="10" height="10"/>
    <rect x="200" y="140" width="10" height="10"/>
    <rect x="120" y="160" width="10" height="10"/>
    <rect x="140" y="160" width="10" height="10"/>
    <rect x="160" y="160" width="10" height="10"/>
    <rect x="180" y="160" width="10" height="10"/>
    <rect x="200" y="160" width="10" height="10"/>
    <rect x="120" y="180" width="10" height="10"/>
    <rect x="140" y="180" width="10" height="10"/>
    <rect x="160" y="180" width="10" height="10"/>
    <rect x="180" y="180" width="10" height="10"/>
    <rect x="200" y="180" width="10" height="10"/>
    <rect x="120" y="200" width="10" height="10"/>
    <rect x="140" y="200" width="10" height="10"/>
    <rect x="160" y="200" width="10" height="10"/>
    <rect x="180" y="200" width="10" height="10"/>
    <rect x="200" y="200" width="10" height="10"/>
    <rect x="120" y="220" width="10" height="10"/>
    <rect x="140" y="220" width="10" height="10"/>
    <rect x="160" y="220" width="10" height="10"/>
    <rect x="180" y="220" width="10" height="10"/>
    <rect x="200" y="220" width="10" height="10"/>
    <rect x="120" y="240" width="10" height="10"/>
    <rect x="140" y="240" width="10" height="10"/>
    <rect x="160" y="240" width="10" height="10"/>
    <rect x="180" y="240" width="10" height="10"/>
    <rect x="200" y="240" width="10" height="10"/>
    <rect x="120" y="260" width="10" height="10"/>
    <rect x="140" y="260" width="10" height="10"/>
    <rect x="160" y="260" width="10" height="10"/>
    <rect x="180" y="260" width="10" height="10"/>
    <rect x="200" y="260" width="10" height="10"/>
    <rect x="120" y="280" width="10" height="10"/>
    <rect x="140" y="280" width="10" height="10"/>
    <rect x="160" y="280" width="10" height="10"/>
    <rect x="180" y="280" width="10" height="10"/>
    <rect x="200" y="280" width="10" height="10"/>
  </g>

  <!-- Alipay label -->
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1649d0" text-anchor="middle">Alipay 支付宝</text>
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">สแกนด้วยแอป Alipay แล้วแนบสลิป</text>
</svg>