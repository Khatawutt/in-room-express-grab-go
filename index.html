<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In-Room Express Grab & Go</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

  <!-- Header -->
  <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg leading-tight">EXPRESS DINING</h1>
      <p class="text-xs text-slate-400">จัดส่งถึงห้องพักภายใน 15-20 นาที</p>
    </div>
    <div class="bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded-full text-sm">
      ห้อง <span id="room-number">1004</span>
    </div>
  </header>

  <!-- Notice Banner -->
  <div class="bg-amber-50 border-l-4 border-amber-500 p-3 m-4 text-xs text-amber-800 rounded">
    <p class="font-semibold">⚡ บริการด่วน Grab & Go</p>
    <p>รายการทั้งหมดพร้อมจัดส่งทันที ค่าบริการบันทึกเข้า Room Charge ณ ตอน Check-out</p>
  </div>

  <!-- Main Menu Area -->
  <main class="px-4 space-y-4">
    <h2 class="font-bold text-gray-700 text-base">รายการแนะนำ (Pre-packed Menu)</h2>
    <div id="menu-container" class="space-y-3"></div>
  </main>

  <!-- Sticky Bottom Cart Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg flex justify-between items-center z-50">
    <div>
      <p class="text-xs text-gray-500">ราคารวมทั้งหมด</p>
      <p class="text-xl font-bold text-slate-900">฿<span id="total-price">0</span></p>
    </div>
    <button onclick="submitOrder()" id="checkout-btn" disabled class="bg-gray-400 text-white font-bold px-6 py-3 rounded-lg shadow transition">
      ยืนยันการสั่งซื้อ (<span id="cart-count">0</span>)
    </button>
  </div>

 <script>
    // 1. URL สำหรับส่งข้อมูลไปยัง Google Sheets
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxyynYpGHXSizyNdIB5KPkcgJXztObR4Zmb9pEQSc1lTdy1x9W9QwJ3rdOxlqOK0d3x/exec";

    // 2. ข้อมูลรายการเมนู
    const menuItems = [
    { id: 1, name: "Fried Chicken Wings", price: 180, desc: "APPETIZER" },
    { id: 2, name: "French Fries", price: 120, desc: "APPETIZER" },
    { id: 3, name: "Fried Calamari", price: 289, desc: "APPETIZER" },
    { id: 4, name: "Sun-Dried Pork", price: 189, desc: "APPETIZER" },
    { id: 5, name: "Caesar Salad (Chicken)", price: 290, desc: "SALAD" },
    { id: 6, name: "Caesar Salad (Bacon)", price: 290, desc: "SALAD" },
    { id: 7, name: "Burrata Cheese Salad", price: 420, desc: "SALAD" },
    { id: 8, name: "Garden Salad", price: 189, desc: "SALAD" },
    { id: 9, name: "Grilled Mushroom Salad", price: 240, desc: "SALAD" },
    { id: 10, name: "Fruit Salad", price: 240, desc: "SALAD" },
    { id: 11, name: "Smoked Salmon Salad", price: 290, desc: "SALAD" },
    { id: 12, name: "Spaghetti Carbonara Bacon", price: 389, desc: "PASTA" },
    { id: 13, name: "Spaghetti Kae Mao Seafood", price: 420, desc: "PASTA" },
    { id: 14, name: "Pesto Spaghetti (Shrimp)", price: 220, desc: "PASTA" },
    { id: 15, name: "Pesto Spaghetti (Chicken)", price: 220, desc: "PASTA" },
    { id: 16, name: "Pesto Spaghetti (Salmon)", price: 300, desc: "PASTA" },
    { id: 17, name: "Pesto Spaghetti (Scallop)", price: 400, desc: "PASTA" },
    { id: 18, name: "Macaroni Shrimp", price: 189, desc: "PASTA" },
    { id: 19, name: "Macaroni Chicken", price: 159, desc: "PASTA" },
    { id: 20, name: "Wagyu Beef Steak", price: 1499, desc: "STEAK" },
    { id: 21, name: "Salmon Steak", price: 590, desc: "STEAK" },
    { id: 22, name: "Bacon & Cheese Pizza", price: 389, desc: "PIZZA" },
    { id: 23, name: "Margherita Pizza", price: 359, desc: "PIZZA" },
    { id: 24, name: "Pesto Mushroom Pizza", price: 490, desc: "PIZZA" },
    { id: 25, name: "Pesto Chicken Pizza", price: 490, desc: "PIZZA" },
    { id: 26, name: "Truffle & Ham Pizza", price: 550, desc: "PIZZA" },
    { id: 27, name: "Burrata & Ham Pizza", price: 590, desc: "PIZZA" },
    { id: 28, name: "Burrata Smoked Salmon Pizza", price: 590, desc: "PIZZA" },
    { id: 29, name: "Thousand Island Seafood Pizza", price: 550, desc: "PIZZA" },
    { id: 30, name: "Pepperoni Pizza", price: 450, desc: "PIZZA" },
    { id: 31, name: "Garlic Shrimp Pizza", price: 450, desc: "PIZZA" },
    { id: 32, name: "Green Curry with Chicken", price: 320, desc: "SOUP & CURRY" },
    { id: 33, name: "Sour Soup with Cha-Om Omelet & Shrimp", price: 320, desc: "SOUP & CURRY" },
    { id: 34, name: "Tom Yum Goong", price: 420, desc: "SOUP & CURRY" },
    { id: 35, name: "Tom Yum Seafood", price: 420, desc: "SOUP & CURRY" },
    { id: 36, name: "Tom Kha Gai (Coconut Chicken Soup)", price: 320, desc: "SOUP & CURRY" },
    { id: 37, name: "Clear Soup with Omelet", price: 180, desc: "SOUP & CURRY" },
    { id: 38, name: "Spicy Mixed Vegetable Soup", price: 260, desc: "SOUP & CURRY" },
    { id: 39, name: "Traditional Spicy Glass Noodle Salad", price: 180, desc: "YUM" },
    { id: 40, name: "Spicy Glass Noodle Salad with Seafood", price: 320, desc: "YUM" },
    { id: 41, name: "Mae Chee Spicy Beef Salad", price: 690, desc: "YUM" },
    { id: 42, name: "Holy Basil Marsh Pork + Fried Egg", price: 159, desc: "RICE & NOODLES" },
    { id: 43, name: "Holy Basil Seafood + Fried Egg", price: 219, desc: "RICE & NOODLES" },
    { id: 44, name: "Holy Basil Grilled Beef", price: 300, desc: "RICE & NOODLES" },
    { id: 45, name: "Shrimp Paste Fried Rice", price: 189, desc: "RICE & NOODLES" },
    { id: 46, name: "Khao Soi Beef Shank", price: 350, desc: "RICE & NOODLES" },
    { id: 47, name: "Khao Soi Chicken", price: 220, desc: "RICE & NOODLES" },
    { id: 48, name: "Rice with Sour Soup & Fried Fish", price: 189, desc: "RICE & NOODLES" },
    { id: 49, name: "Mackerel Fried Rice", price: 280, desc: "RICE & NOODLES" },
    { id: 50, name: "Pork Fried Rice", price: 350, desc: "RICE & NOODLES" },
    { id: 51, name: "Rice Noodles with Spicy Pork Sauce", price: 189, desc: "RICE & NOODLES" },
    { id: 52, name: "Rice Noodle Green Curry & Fried Gourami", price: 189, desc: "RICE & NOODLES" },
    { id: 53, name: "Pad Thai Fresh Shrimp", price: 189, desc: "RICE & NOODLES" },
    { id: 54, name: "Stir-fried Noodles with Chicken", price: 159, desc: "RICE & NOODLES" },
    { id: 55, name: "Stir-fried Noodles with Soy Sauce", price: 159, desc: "RICE & NOODLES" }
];
    const cart = {};

    // 3. ดึงค่าห้องพัก
    const urlParams = new URLSearchParams(window.location.search);
    let rawRoom = urlParams.get('room') || 'ไม่ระบุห้อง';
    if (rawRoom.includes('http')) {
        rawRoom = rawRoom.split('http')[0];
    }
    const room = rawRoom;

    // 4. เรนเดอร์หน้าจอเมื่อโหลดเว็บ
    document.addEventListener("DOMContentLoaded", () => {
        const roomElement = document.getElementById('room-number');
        if (roomElement) roomElement.innerText = room;

        renderMenu();
        updateCartUI();
    });

    function renderMenu() {
        const container = document.getElementById('menu-container');
        if (!container) return;
        
        container.innerHTML = menuItems.map(item => `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                <div class="flex-1 pr-4">
                    <h3 class="font-bold text-gray-800 text-sm">${item.name}</h3>
                    <p class="text-xs text-gray-500 mt-1">${item.desc}</p>
                    <p class="font-bold text-amber-600 mt-2 text-sm">฿${item.price}</p>
                </div>
                <div class="flex items-center space-x-2 bg-gray-50 p-1 rounded-lg border">
                    <button onclick="changeQty(${item.id}, -1)" class="w-8 h-8 rounded-md bg-white shadow-sm flex items-center justify-center text-gray-600 font-bold active:scale-95">-</button>
                    <span id="qty-${item.id}" class="w-6 text-center font-bold text-sm">0</span>
                    <button onclick="changeQty(${item.id}, 1)" class="w-8 h-8 rounded-md bg-amber-500 text-white shadow-sm flex items-center justify-center font-bold active:scale-95">+</button>
                </div>
            </div>
        `).join('');
    }

    function changeQty(id, change) {
        cart[id] = (cart[id] || 0) + change;
        if (cart[id] <= 0) delete cart[id];
        
        const qtyEl = document.getElementById(`qty-${id}`);
        if (qtyEl) qtyEl.innerText = cart[id] || 0;
        
        updateCartUI();
    }

    function updateCartUI() {
        let totalCount = 0;
        let totalPrice = 0;

        for (const id in cart) {
            const item = menuItems.find(m => m.id == id);
            if (item) {
                totalCount += cart[id];
                totalPrice += item.price * cart[id];
            }
        }

        const countEl = document.getElementById('cart-count');
        const priceEl = document.getElementById('total-price');
        const btn = document.getElementById('checkout-btn');

        if (countEl) countEl.innerText = totalCount;
        if (priceEl) priceEl.innerText = totalPrice;
        
        if (btn) {
            if (totalCount === 0) {
                btn.disabled = true;
                btn.classList.replace('bg-amber-500', 'bg-gray-400');
            } else {
                btn.disabled = false;
                btn.classList.replace('bg-gray-400', 'bg-amber-500');
            }
        }
    }

    // 5. ฟังก์ชันส่งออเดอร์ไปยัง Google Sheets (จัดกลุ่ม Kitchen / Beverage)
    async function submitOrder() {
        const btn = document.getElementById('checkout-btn');
        btn.disabled = true;
        btn.innerHTML = "กำลังส่งออเดอร์...";

        let kitchenOrders = {};
        let beverageOrders = {};
        let total = 0;

        // จัดเตรียมและคัดแยกข้อมูล
        for (const id in cart) {
            const item = menuItems.find(m => m.id == id);
            if (item && cart[id] > 0) {
                let category = item.desc || "OTHER";
                let orderText = `${item.name} x ${cart[id]}`;
                total += item.price * cart[id];
                
                // เช็กว่าเป็นเครื่องดื่มหรือไม่
                let isBeverage = (category.toUpperCase().includes("BEVERAGE") || category.toUpperCase().includes("DRINK") || item.name.includes("กาแฟ") || item.name.includes("น้ำ"));

                if (isBeverage) {
                    if (!beverageOrders[category]) beverageOrders[category] = [];
                    beverageOrders[category].push(orderText);
                } else {
                    if (!kitchenOrders[category]) kitchenOrders[category] = [];
                    kitchenOrders[category].push(orderText);
                }
            }
        }

        // ฟังก์ชันแปลงข้อมูลเป็นข้อความจัดกลุ่ม
        function formatTicket(orderObj) {
            let ticket = [];
            for (let cat in orderObj) {
                ticket.push(`[${cat}]\n- ` + orderObj[cat].join('\n- '));
            }
            return ticket.join('\n\n');
        }

        const payload = {
            room: room,
            kitchenItems: formatTicket(kitchenOrders) || "-",
            beverageItems: formatTicket(beverageOrders) || "-",
            totalPrice: total
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            });

            alert("ส่งออเดอร์เรียบร้อยแล้ว! เจ้าหน้าที่จะจัดส่งถึงห้องโดยเร็วที่สุดครับ");
            
            // ล้างข้อมูลหลังส่งสำเร็จ
            for (let key in cart) delete cart[key];
            menuItems.forEach(item => {
                const qtyEl = document.getElementById(`qty-${item.id}`);
                if (qtyEl) qtyEl.innerText = '0';
            });

        } catch (error) {
            console.error('Error submitting order:', error);
            alert("เกิดข้อผิดพลาดในการส่งออเดอร์ กรุณาลองใหม่อีกครั้ง");
        } finally {
            // คืนค่าปุ่มกลับสู่สภาพเดิม
            btn.innerHTML = `ยืนยันการสั่งซื้อ (<span id="cart-count">0</span>)`;
            updateCartUI(); 
        }
    }
</script>
</body>
</html>
